<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Xtra Focus — small promo tile 440x280</title>
<style>
  /* Chrome Web Store small promo tile — must render at exactly 440x280. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 440px; height: 280px; overflow: hidden; }
  body {
    background: #0f1419;
    font-family: "Segoe UI", -apple-system, Roboto, Helvetica, Arial, sans-serif;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 0 34px;
    position: relative;
  }
  /* soft green bloom behind the mark, echoing the icon's centre dot */
  body::before {
    content: "";
    position: absolute;
    left: -60px; top: 50%;
    width: 320px; height: 320px;
    transform: translateY(-50%);
    background: radial-gradient(circle, rgba(52,211,153,0.20), rgba(52,211,153,0) 68%);
    pointer-events: none;
  }
  .mark {
    width: 108px; height: 108px;
    flex-shrink: 0;
    position: relative;
    filter: drop-shadow(0 8px 24px rgba(0,0,0,0.55));
  }
  .copy { position: relative; }
  h1 {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.05;
  }
  h1 span { color: #34d399; }
  p {
    margin-top: 12px;
    font-size: 17px;
    line-height: 1.35;
    color: #8b98a5;
    font-weight: 500;
  }
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 128 128">
    <rect x="0" y="0" width="128" height="128" rx="28" fill="#151c22" stroke="rgba(255,255,255,0.09)" stroke-width="1.5"/>
    <g fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 48V34a10 10 0 0 1 10-10h14"/>
      <path d="M80 24h14a10 10 0 0 1 10 10v14"/>
      <path d="M104 80v14a10 10 0 0 1-10 10H80"/>
      <path d="M48 104H34a10 10 0 0 1-10-10V80"/>
    </g>
    <circle cx="64" cy="64" r="10" fill="#34d399"/>
  </svg>
  <div class="copy">
    <h1>Xtra<br>Focus</h1>
    <p>Keep only the X<br>you came for.</p>
  </div>
</body>
</html>
