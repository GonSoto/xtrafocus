<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Xtra Focus — marquee promo tile 1400x560</title>
<style>
  /* Chrome Web Store marquee promo tile — must render at exactly 1400x560. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1400px; height: 560px; overflow: hidden; }
  body {
    background: #0f1419;
    font-family: "Segoe UI", -apple-system, Roboto, Helvetica, Arial, sans-serif;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 72px;
    padding: 0 96px;
    position: relative;
  }
  body::before {
    content: "";
    position: absolute;
    left: 60px; top: 50%;
    width: 760px; height: 760px;
    transform: translateY(-50%);
    background: radial-gradient(circle, rgba(52,211,153,0.18), rgba(52,211,153,0) 65%);
    pointer-events: none;
  }
  .mark {
    width: 232px; height: 232px;
    flex-shrink: 0;
    position: relative;
    filter: drop-shadow(0 18px 48px rgba(0,0,0,0.6));
  }
  .copy { position: relative; }
  h1 {
    font-size: 92px;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  p {
    margin-top: 20px;
    font-size: 30px;
    line-height: 1.3;
    color: #8b98a5;
    font-weight: 500;
  }
  ul {
    margin-top: 34px;
    display: flex;
    gap: 12px;
    list-style: none;
  }
  li {
    font-size: 19px;
    font-weight: 600;
    color: #c9d1d9;
    padding: 10px 18px;
    border: 1px solid #2f3336;
    border-radius: 999px;
    background: #151c22;
  }
  li b { color: #34d399; font-weight: 700; }
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 128 128">
    <rect x="0" y="0" width="128" height="128" rx="28" fill="#151c22" stroke="rgba(255,255,255,0.09)" stroke-width="1.5"/>
    <g fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 48V34a10 10 0 0 1 10-10h14"/>
      <path d="M80 24h14a10 10 0 0 1 10 10v14"/>
      <path d="M104 80v14a10 10 0 0 1-10 10H80"/>
      <path d="M48 104H34a10 10 0 0 1-10-10V80"/>
    </g>
    <circle cx="64" cy="64" r="10" fill="#34d399"/>
  </svg>
  <div class="copy">
    <h1>Xtra Focus</h1>
    <p>Hide the feed, trends, suggestions, ads and Grok.<br>You choose what stays.</p>
    <ul>
      <li><b>19</b> toggles</li>
      <li>Instant, no reload</li>
      <li>No data collected</li>
    </ul>
  </div>
</body>
</html>
